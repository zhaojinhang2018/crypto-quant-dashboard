name: Auto Update Quant Dashboard

on:
  schedule:
    # 北京时间每天 08:30 和 21:30 自动更新 (UTC 00:30, 13:30)
    - cron: '30 0,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run quant scoring and stablecoin dashboard update
        run: |
          python update_quant_score.py
          python update_stablecoin_etf.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quant_data.js quant_data.json stablecoin_etf_data.js stablecoin_etf_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update quant dashboard data"
            git push
          fi
